name: Redirect GitHub Pages to the demo

# The live demo is at https://anyview.harshpreet.com (deployed by Vercel on
# every push to main). This keeps old https://harshpreet931.github.io/anyview/
# links working by redirecting them, path included.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write redirect pages
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>anyview demo has moved</title>
          <link rel="canonical" href="https://anyview.harshpreet.com/">
          <meta http-equiv="refresh" content="0; url=https://anyview.harshpreet.com/">
          <script>
            location.replace('https://anyview.harshpreet.com' + location.pathname.replace(/^\/anyview/, '') + location.search + location.hash);
          </script>
          <p>The demo moved to <a href="https://anyview.harshpreet.com/">anyview.harshpreet.com</a>.</p>
          HTML
          cp site/index.html site/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
